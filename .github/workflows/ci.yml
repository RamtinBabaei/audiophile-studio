name: Audiophile CI and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audiophile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Test deployment configuration
        run: node --test scripts/github-deploy-config.test.mjs
      - run: pnpm build
      - run: pnpm db:migrate:local
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Browser journeys against the production Worker
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8787
        run: |
          mkdir -p .sites-runtime
          pnpm start > .sites-runtime/ci-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8787/api/health; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat .sites-runtime/ci-server.log
            exit 1
          fi
          pnpm test:e2e
      - name: Prepare independent Cloudflare configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/prepare-github-deploy.mjs
      - name: Apply production database migrations
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply DB --remote --config dist/server/wrangler.json
      - name: Deploy public website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json | tee .sites-runtime/deploy.log
      - name: Check live database and show website link
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
        run: node scripts/check-github-deploy.mjs
      - name: Deployment setup status
        if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED != 'true'
        run: echo 'Quality checks completed. Follow docs/GITHUB_ACTIONS_FA.md to enable public deployment.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: diagnostic-results
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            test-results
            playwright-report
            .sites-runtime/ci-server.log
